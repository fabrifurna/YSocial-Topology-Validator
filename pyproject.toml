[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sdt-netval"
version = "0.1.0"
description = "Universal topology validator for multi-agent social simulation networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "social network analysis",
    "agent-based simulation",
    "network topology",
    "digital twins",
    "llm simulation",
]
dependencies = [
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "powerlaw>=1.5",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
